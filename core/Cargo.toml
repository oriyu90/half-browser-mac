[package]
name = "half-browser-core"
version = "0.1.0"
edition = "2024"
description = "Pure-logic core for Half-Browser (macOS port)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
url = "2"
getrandom = "0.2"
regex = "1"

[dev-dependencies]
proptest = "1"
